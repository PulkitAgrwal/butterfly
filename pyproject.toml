[project]
name = "butterfly"
version = "0.1.0"
description = "Find the flap that caused the storm: graph-based failure attribution for multi-agent LLM runs, on FalkorDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=3.33.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
